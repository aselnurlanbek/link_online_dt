[Env]
env_name=halfcheetah-medium-expert-v0                    ; OpenAI gym environment name
minari_dataset_name=mujoco/halfcheetah/expert-v0
seed=0                                              ; PyTorch and Numpy seeds
train_seed=10                                       ; training env - random seed
deterministic_torch = False                         ; configure PyTorch to use deterministic algorithms instead of nondeterministic ones

[Eval]
eval_freq = 500                                     ; evaluation frequency, will evaluate eval_every training steps
n_eval_episodes = 5                                 ; number of episodes to run during evaluation
target_returns = (12000.0, 3000.0)                  ; target return-to-go for the prompting during evaluation
checkpoints_path = ""                               ; path for checkpoints saving, optional

[WandbConfig]
wandb_group = DT-MINARI                                   ; wandb group name
wandb_name = DT                                           ; wandb run name

[Train]
algorithm_name = DT
embedding_dim = 128                                 ; transformer hidden dim
num_layers = 3                                      ; depth of the transformer model
num_heads = 1                                       ; number of heads in the attention
seq_len = 20                                        ; maximum sequence length during training
episode_len = 1_000                                 ; maximum rollout length, needed for the positional embeddings
attention_dropout = 0.1                             ; attention dropout
residual_dropout = 0.1                              ; residual dropout
embedding_dropout = 0.1                             ; embeddings dropout
learning_rate = 1e-4                                ; AdamW optimizer learning rate
beta1 = 0.9                                         ; AdamW optimizer beta1
beta2 = 0.999                                       ; AdamW optimizer beta2
weight_decay = 1e-4                                 ; AdamW weight decay
clip_grad = 0.25                                    ; maximum gradient norm during training, optional
batch_size = 256                                    ; training batch size
max_update_steps = 100_000                              ; total training steps
warmup_steps = 10_000                               ; warmup steps for the learning rate scheduler
print_freq = 10
load_model = ""

[Normalize]
state_normalization = True                                    ; whether to normalize states
return_scale = 1.0                                  ; reward scaling